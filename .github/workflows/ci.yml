name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned to match the version dev runs locally so lint output doesn't drift
      # between the two. Bump in lockstep when upgrading.
      - run: pip install ruff==0.15.13
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  # NOTE: the postgres service block, install-deps step, and HF cache step
  # below are duplicated in eval.yml. Keep them in sync — if you change the
  # cache key, pgvector tag, or pip install line here, do the same there.
  # Composite-action extraction deferred until a third workflow shows up.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KNOWLEDGE_DOMAIN: sample
      PG_DSN_OVERRIDE: postgresql://postgres:postgres@localhost:5432/postgres
      KNOWLEDGE_DB_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install -e .
      # The HF cache is what dominates first-run cost — sentence-transformers
      # weights are ~80 MB and the cross-encoder reranker is ~280 MB.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-${{ runner.os }}-st-MiniLM-L6-bge-reranker-base
      - name: Run pytest
        run: pytest -m "not slow" --cov=src/knowledge_rag --cov-report=term

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: knowledge-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
